services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-it_infrastructure}
      POSTGRES_USER: ${POSTGRES_USER:-it_manager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be provided}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [it-internal]

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-it_manager}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-it_infrastructure}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be provided}
      OAUTH_SERVER_URL: ${OAUTH_SERVER_URL:?OAUTH_SERVER_URL must be provided}
      PROMETHEUS_URL: http://prometheus:9090
      PROMETHEUS_TIMEOUT_MS: ${PROMETHEUS_TIMEOUT_MS:-3000}
      MONITORING_ENABLED: ${MONITORING_ENABLED:-true}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [it-internal]
    ports: ["3000:3000"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    networks: [it-internal]
    ports: ["8080:80"]

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      node-exporter:
        condition: service_healthy
    networks: [it-internal]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/-/healthy >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  node-exporter:
    image: prom/node-exporter:v1.8.2
    command:
      - --path.rootfs=/host
    pid: host
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    volumes:
      - /:/host:ro,rslave
    networks: [it-internal]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9100/metrics >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

networks:
  it-internal:
    driver: bridge

volumes:
  postgres_data:
  prometheus_data:
